<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TAMA Studios</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
    <div class="card">
        
        <img src="tamalogo.webp" alt="TAMA Studios Logo" class="logo" />
        
        <h2>Login to TAMA Studios</h2>
        <p>Please enter your email and password</p>

        <!-- Login Form -->
        <form id="loginForm">
            <label for="email"></label><input type="email" id="email" placeholder="Email" required />
            <label for="password"></label><input type="password" id="password" placeholder="Password" required />
            <button type="submit" class="btn-primary">Login</button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <hr><span>or</span><hr>
        </div>

        <!-- Google Login -->
        <button id="googleLogin" class="btn-google">
            <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" />
            Continue with Google
        </button>

        <!-- Register Form Toggle -->
        <p class="switch">
            Don’t have an account?
            <a href="#" id="toggleRegister">Register</a>
        </p>

        <!-- Messages -->
        <p id="message" class="message"></p>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
