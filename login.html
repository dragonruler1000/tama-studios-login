<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back</h2>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
        <input type="email" id="email" placeholder="Email" required
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"/>
        <input type="password" id="password" placeholder="Password" required
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"/>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
            Login
        </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
        <hr class="flex-grow border-gray-300"/>
        <span class="mx-2 text-gray-400">or</span>
        <hr class="flex-grow border-gray-300"/>
    </div>

    <!-- Google Login -->
    <button id="googleLogin"
            class="w-full border border-gray-300 py-2 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="w-5 h-5"/>
        Continue with Google
    </button>

    <!-- Register Form -->
    <p class="text-center mt-6 text-gray-600">
        Don’t have an account?
        <a href="#" id="toggleRegister" class="text-blue-600 hover:underline">Register</a>
    </p>

    <!-- Error / Success Messages -->
    <p id="message" class="mt-4 text-center text-sm"></p>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
